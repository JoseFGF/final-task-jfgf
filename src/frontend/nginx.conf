# Disparo trivial para forzar ci-develop-front.yml con el fix de
# minúsculas en el tag de GHCR (specs/002-cicd-pipeline-branching).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker: se usa una variable en `proxy_pass` (en vez de
    # un host literal) para que nginx resuelva "backend" de forma perezosa,
    # en cada request, con este resolver. Con un host literal, nginx intenta
    # resolverlo una sola vez al arrancar y el worker falla si "backend"
    # todavía no existe en la red (p.ej. al construir/probar esta imagen de
    # forma aislada, sin docker-compose).
    resolver 127.0.0.11 valid=30s;

    # `OrderApiService` (src/app/orders/order-api.service.ts) llama a rutas
    # relativas ("/api/v1/..."), es decir, mismo origen que el frontend. En
    # docker-compose el backend vive en el host "backend" del puerto 8443
    # sobre HTTPS con un certificado autofirmado de desarrollo (perfil
    # `prod`, application-prod.yml). Sin este proxy, esas llamadas irían al
    # propio contenedor de nginx (404) en vez de al backend.
    location /api/ {
        # IMPORTANTE: cuando proxy_pass usa una variable, nginx NO reescribe
        # el URI (no hace el "reemplazar el prefijo de location" que sí hace
        # con un proxy_pass literal) — reenvía el URI original del cliente
        # tal cual, sin usar ningún sufijo de path aquí. Se descubrió este
        # comportamiento de la manera dura: con "proxy_pass $backend_upstream/api/;"
        # nginx enviaba literalmente "/api/" al backend (descartando
        # "v1/orders"), dando 401/404 en vez de proxyar la ruta real. La
        # solución correcta es NO añadir ningún path tras la variable — el
        # URI del cliente ya es exactamente "/api/v1/..." y coincide con lo
        # que el backend espera, así que se reenvía sin modificar.
        set $backend_upstream https://backend:8443;
        proxy_pass $backend_upstream;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    # SPA de Angular con rutas (/orders, /orders/:id, ...): si el archivo o
    # directorio solicitado no existe físicamente, se sirve index.html para
    # que el router de Angular resuelva la ruta (evita 404 al recargar).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
