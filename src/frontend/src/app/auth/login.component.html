<section class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-4 py-8">
  <h2 class="text-xl font-semibold text-gray-900">Iniciar sesión</h2>

  <form class="mt-6 space-y-6" [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        required
        autocomplete="username"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        required
        autocomplete="current-password"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />
    </div>

    @if (errorMessage()) {
      <p class="rounded-md bg-red-50 p-4 text-sm text-red-800" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <button
      type="submit"
      [disabled]="!canSubmit"
      class="inline-flex w-full items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 disabled:cursor-not-allowed disabled:bg-gray-300"
    >
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</section>
