name: PR Validation - Frontend

# US1 (spec.md FR-001, FR-003): validaciones bloqueantes para toda PR desde
# una rama de feature hacia develop que toque el frontend. FR-003 fija el
# mínimo de frontend como pruebas + secretos — deliberadamente sin análisis
# de imagen (ver data-model.md, fila "Vulnerabilidades de imagen").

on:
  pull_request:
    branches: [develop]
    paths:
      - "src/frontend/**"

permissions:
  contents: read

jobs:
  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: npm ci
        working-directory: src/frontend
        run: npm ci
      - name: ng test (headless, sin watch)
        working-directory: src/frontend
        run: npx ng test --watch=false --browsers=ChromeHeadless

  frontend-secrets-scan:
    name: frontend-secrets-scan
    runs-on: ubuntu-latest
    container:
      image: docker://zricethezav/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: gitleaks detect
        run: gitleaks detect --source . --redact --exit-code 1

  constitution-guardian:
    name: constitution-guardian
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_constitution-guardian.yml
    with:
      also_check_app_constitution: true
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
