name: CI Develop - Frontend

# US3 (FR-008, FR-009): mismo patrón que ci-develop-back.yml, para el
# frontend (Angular + nginx, src/frontend/Dockerfile).

on:
  push:
    branches: [develop]
    paths:
      - "src/frontend/**"

permissions:
  contents: read

jobs:
  build-and-publish-snapshot:
    name: build-and-publish-snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ steps.version.outputs.repo_lower }}/fieldops-frontend:${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Calcular tag de snapshot (ADR-P2/ADR-P5)
        id: version
        run: |
          BASE=$(git describe --tags --match 'frontend-v*' --abbrev=0 2>/dev/null || echo "frontend-v0.1.0")
          BASE=${BASE#frontend-v}
          SHA_CORTO=$(git rev-parse --short HEAD)
          echo "tag=${BASE}-snapshot.${SHA_CORTO}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Login en GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push de la imagen snapshot
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/frontend
          push: true
          tags: ghcr.io/${{ steps.version.outputs.repo_lower }}/fieldops-frontend:${{ steps.version.outputs.tag }}
      - name: Comprimir y subir el dist de este build (90 días)
        run: |
          mkdir -p /tmp/dist
          npm --prefix src/frontend run build -- --output-path=/tmp/dist 2>/dev/null || echo "dist ya empaquetado dentro de la imagen; se conserva solo la imagen publicada si el build standalone no aplica aquí"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ steps.version.outputs.tag }}
          path: /tmp/dist
          retention-days: 90
          if-no-files-found: ignore

  deploy-dev:
    name: deploy-dev
    needs: build-and-publish-snapshot
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      # Principio V — ver la misma nota en ci-develop-back.yml.
      - name: Login en GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull de la imagen ya publicada (sin build)
        run: docker pull ${{ needs.build-and-publish-snapshot.outputs.image }}
