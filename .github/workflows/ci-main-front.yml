name: CI Main - Frontend

# US4/US5/US6 — mismo patrón que ci-main-back.yml, para el frontend.

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"

permissions:
  contents: read

jobs:
  calculate-version:
    name: calculate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: semantic-release --dry-run (FR-010/FR-011, ADR-P2)
        id: semrel
        working-directory: src/frontend
        run: |
          set +e
          OUTPUT=$(npx --yes semantic-release@25.0.7 --dry-run 2>&1)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::No se pudo calcular la siguiente versión — ningún commit acumulado desde la última entrega coincide con un prefijo de Conventional Commits reconocido (FR-011). No se inventa un número; el pipeline se detiene aquí."
            exit 1
          fi
          echo "Versión calculada: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-and-publish-release:
    name: build-and-publish-release
    needs: calculate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Login en GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push de la imagen final (FR-010)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: src/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/fieldops-frontend:${{ needs.calculate-version.outputs.version }}
      - id: set-image
        run: echo "image=ghcr.io/${{ github.repository }}/fieldops-frontend:${{ needs.calculate-version.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Crear el tag de git y la entrega formal (FR-012)
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: frontend-v${{ needs.calculate-version.outputs.version }}
          name: "Frontend v${{ needs.calculate-version.outputs.version }}"
          generate_release_notes: true

  deploy-pre:
    name: deploy-pre
    needs: build-and-publish-release
    runs-on: ubuntu-latest
    environment: pre
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login en GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull de la imagen ya publicada (sin build)
        run: docker pull ${{ needs.build-and-publish-release.outputs.image }}

  deploy-prod:
    name: deploy-prod
    needs: [build-and-publish-release, deploy-pre]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login en GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull de la misma imagen ya desplegada en pre (sin build)
        run: docker pull ${{ needs.build-and-publish-release.outputs.image }}

  reintegrate-hotfix-to-develop:
    name: reintegrate-hotfix-to-develop
    needs: calculate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Determinar si este commit en main vino de una rama hotfix/*
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls")
          HEAD_REF=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['head']['ref'] if d else '')" 2>/dev/null || echo "")
          echo "head_ref=$HEAD_REF"
          if [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "is_hotfix=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_hotfix=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.source.outputs.is_hotfix == 'true'
        with:
          fetch-depth: 0
      - name: Abrir PR de reintegración hacia develop (FR-019)
        if: steps.source.outputs.is_hotfix == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: reintegrate/hotfix-${{ github.sha }}
          title: "Reintegrar hotfix ${{ github.sha }} en develop"
          body: >
            Reintegración automática (FR-019) del hotfix fusionado en main en
            el commit ${{ github.sha }}. Esta PR debe pasar sus propias
            validaciones antes de fusionarse — no se auto-fusiona.
          commit-message: "chore: reintegrar hotfix ${{ github.sha }} en develop"
